{% extends "base.html" %}

{% block content %}
<section>
  <h1>tagged: {{ term.name }}</h1>
  <ul class="post-list">
    {% for page in term.pages %}
    <li>
      <a href="{{ page.permalink }}">{{ page.title }}</a>
      {% if page.date %}<span class="date">{{ page.date | date(format="%Y-%m-%d") }}</span>{% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
