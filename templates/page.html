{% extends "base.html" %}

{% block content %}
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <time class="date" datetime="{{ page.date }}">
      {{ page.date | date(format="%B %d, %Y") }}
    </time>
    {% endif %}
    {% if page.taxonomies.tags %}
    <div class="tags">
      {% for tag in page.taxonomies.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
