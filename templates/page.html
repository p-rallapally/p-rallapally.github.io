{% extends "base.html" %}

{% block content %}
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.extra.label %}
    <span class="date">{{ page.extra.label }}</span>
    {% endif %}
    {% if page.taxonomies.tags %}
    <div class="tags">
      {% for tag in page.taxonomies.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
